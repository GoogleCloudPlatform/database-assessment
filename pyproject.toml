####################
# Project Metadata #
####################

[project]
description = "Database Migration Assessment"
license = { text = "Apache-2.0" }
name = "dma"
readme = "README.md"
requires-python = ">=3.10"
version = "4.3.48"

# keywords for easier look-up on PyPI
authors = [
    { name = "Cody Fincher", email = "codyfincher@google.com" },
    { name = "Warren Puziewicz", email = "wpuziewicz@google.com" },
    { name = "Steve Senior", email = "stevesenior@google.com" },
    { name = "Shane Borden", email = "shaneborden@google.com" },
    { name = "Eri Santos", email = "erisantos@google.com" },
    { name = "Tim Chapman", email = "chapmantim@google.com" },
]
keywords = [
    "database",
    "migration",
    "assessment",
    "postgres",
    "mysql",
    "oracle",
    "mssql",
    "duckdb",
    "litestar",
    "dma",
    "granian",
    "gcp",
    "google",
    "alloydb",
    "mariadb",
]
maintainers = [
    { name = "Cody Fincher", email = "codyfincher@google.com" },
    { name = "Warren Puziewicz", email = "wpuziewicz@google.com" },
    { name = "Steve Senior", email = "stevesenior@google.com" },
    { name = "Shane Borden", email = "shaneborden@google.com" },
    { name = "Eri Santos", email = "erisantos@google.com" },
    { name = "Tim Chapman", email = "chapmantim@google.com" },
]
# options under https://pypi.org/classifiers/
classifiers = [ # ToDo: Modify according to your needs!
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "click>=8.1.7",
    "packaging>=23.0",
]

[project.urls]
# important URLs for this project
Documentation = "https://googlecloudplatform.github.io/database-assessment/"
Issues = "https://github.com/GoogleCloudPlatform/database-assessment/issues"
Source = "https://github.com/GoogleCloudPlatform/database-assessment"

#####################
# UV Configuration  #
#####################

[tool.uv]
managed = true
package = false

[dependency-groups]
dev = [
    "bump-my-version",{ include-group = "lint" }, { include-group = "test" }, { include-group = "docs" }
]
test = [
    "coverage[toml]>=6.2",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-mock",
    "pytest-sugar",
    "pytest-xdist>=3.6.0",
    "filelock>=3.0.0",
]
lint = [
    "mypy>=1.13.0",
    "ruff>=0.14.0",
    "pylint",
    "pre-commit>=3.5.0",
    "types-click",
    "types-six",
    "types-decorator",
    "types-pyyaml",
    "types-setuptools",
    "pyyaml>=6",
]

docs = [
    "sphinx>=8.0.0",
    "sphinx-immaterial>=0.13.0",
    "myst-parser>=4.0.0",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "linkchecker>=10.3.0",
]

build = [
    "bump-my-version>=1.2.4",
]

#####################
# Version Management #
#####################

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "-S --no-verify"
current_version = "4.3.48"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
name = "dma"
version = "{current_version}"
"""
replace = """
name = "dma"
version = "{new_version}"
"""

[[tool.bumpversion.files]]
filename = "scripts/masker/dma-collection-masker"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "scripts/collector/oracle/collect-data.sh"
search = 'dma_version="{current_version}"'
replace = 'dma_version="{new_version}"'

[[tool.bumpversion.files]]
filename = "scripts/collector/mysql/collect-data.sh"
search = 'dma_version="{current_version}"'
replace = 'dma_version="{new_version}"'

[[tool.bumpversion.files]]
filename = "scripts/collector/postgres/collect-data.sh"
search = 'dma_version="{current_version}"'
replace = 'dma_version="{new_version}"'

[[tool.bumpversion.files]]
filename = "scripts/collector/sqlserver/instanceReview.ps1"
search = '$op_version = "{current_version}"'
replace = '$op_version = "{new_version}"'


##################
# External Tools #
##################

## Linting Tools

[tool.slotscheck]
strict-imports = false

[tool.codespell]
ignore-words-list = "alog,astroid,iif,Americanas"
skip = 'pdm.lock,package-lock.json,uv.lock,*.ps1'

[tool.pyright]
autoSearchPaths = false
exclude = ["docs/**/*.py", "scripts/**/*.py", "tools/scripts/**/*.py"]
extraPaths = []                                                # Include paths from PYTHONPATH env var and .env definition
include = ["tools", "tests"]
pythonVersion = "3.10"
reportMissingImports = "information"
reportMissingTypeStubs = "information"
reportUnknownMemberType = "none"
reportUnnecessaryTypeIgnoreComments = true
root = ["."]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = false
files = ["tools/lib", "tools/postgres", "tools/mysql", "tools/oracle", "tools/sqlserver", "tests"]
follow_imports = "normal"     # "silent" for not following
ignore_missing_imports = true
pretty = true
show_column_numbers = true
warn_no_return = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = ["tests.*"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
ignore_missing_imports = true
follow_imports = "skip"
module = ["sphinx.*", "pygments.*", "docutils.*"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["nodeenv", "sqlspec.*"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "tools/scripts",
    "venv",
    '__pycache__',
]
fix = true
include = ["tests/**/*.py", "tests/**/*.pyi", "tools/**/*.py", "docs/**/*.py"]
line-length = 120
lint.fixable = ["ALL"]
lint.ignore = [
    "B027",   # Allow non-abstract empty methods in abstract base classes
    "FBT003", # Allow boolean positional values in function calls, like `dict.get(... True)`
    # Ignore checks for possible passwords
    "S105",
    "S106",
    "S107",
    # Ignore complexity
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC1901", # empty string comparisons
    "PLW2901", # `for` loop variable overwritten
    "SIM114",  # Combine `if` branches using logical `or` operator
    "E203",    # Whitespace before :, needed for black compatibility and also `ruff format`
    "ISC001",  # causes unexpected behaviour with formatter
    "E501",    # pycodestyle line too long, handled by black
    "D100",    # pydocstyle - missing docstring in public module
    "D101",    # pydocstyle - missing docstring in public class
    "D102",    # pydocstyle - missing docstring in public method
    "D103",    # pydocstyle - missing docstring in public function
    "D104",    # pydocstyle - missing docstring in public package
    "D105",    # pydocstyle - missing docstring in magic method
    "D106",    # pydocstyle - missing docstring in public nested class
    "D107",    # pydocstyle - missing docstring in __init__
    "D202",    # pydocstyle - no blank lines allowed after function docstring
    "D205",    # pydocstyle - 1 blank line required between summary line and description
    "D415",    # pydocstyle - first line should end with a period, question mark, or exclamation point
    "UP037",   # pyupgrade - removes quotes from type annotation
    "A003",    # flake8-builtins - class attribute {name} is shadowing a python builtin
    "B010",    # flake8-bugbear - do not call setattr with a constant attribute value
    "B008",    #  flake8-bugbear - Do not perform function call `Parameter` in argument defaultsRuff(B008)
    "RUF012",  # ruff - mutable class attributes should be annotated with `typing.ClassVar`
    "ANN401",  # ruff - Dynamically typed expressions (typing.Any) are disallowed
    "PLR0913", # ruff - Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "FBT001",  # Boolean typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean Boolean default positional argument in function definition
    "ARG002",  # Unused method argument
    "ARG001",  #  Unused function argument
    "TD002",
    "TD003",
    "FIX002",
    "PGH003",
    "RUF006",
    "SLF001",
    "PT007",
    'S603',
    "E501",    # pycodestyle line too long, handled by black
    "PLW2901", # pylint - for loop variable overwritten by assignment target
    "ANN401",
    "FBT",
    "PLR0913", # too many arguments
    "PT",
    "TD",
    "PERF203", # ignore for now; investigate
    "COM812",
    "PLR0917",
    "DOC201",  # `return` is not documented in docstring
    "DOC501",  # Raised exception missing from docstring
    "DOC502",  # Raised exception missing from docstring
    "A005",    # module shadows builtin
    "DOC402",  # Yield missing from docstring
]
lint.select = ["ALL"]
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
preview = true                                                    # preview features & checks, use with caution
src = ["tests/", "scripts/", "tools/", "docs/", "notebooks/"]
target-version = "py310"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["tests", "scripts", "tools"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Allow print/pprint
"docs/*" = ["S404", "INP001", "A001"]
"examples/*" = ["T201"]
# Tests can use magic values, assertions, and relative imports
"__init__.py" = ['F401', 'D104']
"__main__.py" = ["E402"]
"scripts/*.py" = ["INP001", "S404"]
"scripts/masker/dma-collection-masker" = [
    "PYI024",
    "FA100",
    "S202",
    "S311",
    "UP006",
    "UP035",
    "FA102",
    "EM101",
    "TRY003",
    "PLR6301",
]
"scripts/post_build.py" = ["ERA001"]
"scripts/pre_build.py" = ["ERA001"]
"tools/**/*.py" = ["INP001", "S404", "T201", "PLR0904", "PLR0914", "S310", "ANN001", "ANN201", "S202", "ERA001"]
"tests/**/*" = [
    "PLR2004",
    "S101",
    "S324",
    "TID252",
    "ERA001",
    "ANN201",
    "ANN001",
    "D103",
    "D104",
    "T201",
    "S404",
    "PLR6301",
    "PLC2701",
    "FA102",
]

# copyright
"**/*.py" = ["CPY001", 'RUF029']

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "sqlalchemy.ext.declarative.declared_attr",
    "sqlalchemy.orm.declared_attr.directive",
    "sqlalchemy.orm.declared_attr",
]

# configure in-case someone runs this
[tool.black]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | venv
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
include = '\.pyi?$'
line-length = 120

## Testing Tools

[tool.pytest.ini_options]
addopts = "-n 2 --dist=loadgroup -ra -q --doctest-glob='*.md'"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:xdist.*",
]
markers = [
    "integration: Integration Tests",
    "unit: Unit Tests",
    "script_test: Collection script tests",
    "slow: Tests that take > 30 seconds",
    "mysql: MySQL Tests",
    "postgres: Postgres Tests",
    "oracle: Oracle Tests",
    "spanner: Google Cloud Spanner Tests",
    "duckdb: DuckDB Tests",
    "mssql: Microsoft SQL Server Tests",
    "server: Web server and API Tests",
]
minversion = "6.0"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
omit = [
    "_version.py",
    "tests/*",
    "scripts/*",
    "tools/scripts/*",
]
parallel = true
source = ["tools"]

[tool.coverage.paths]
source = ["tools/"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
