name: ci

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  build-collection-scripts:
    name: Collection Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Building Collection scripts
        run: make build-collector
  test-linux:
    name: "Test Linux - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
  test-windows:
    name: "Test Windows - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [  windows-latest ]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
  test-osx:
    name: "Test OSX - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [ macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
