name: release

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  STABLE_PYTHON_VERSION: "3.13"

jobs:
  collection-scripts:
    name: Package collections scripts for release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.STABLE_PYTHON_VERSION }}

      - name: Building & Package Collector
        run: make clean && make build-collector
      - uses: actions/upload-artifact@v7
        with:
          name: collections
          path: |
            dist/*.zip
            dist/dma-collection-masker
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release
    needs:
      - collection-scripts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Add assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
